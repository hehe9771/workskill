installed:
- data-model-diagram
- memorylint
- preview
- superb
- wireframe
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: wireframe
    command: speckit.wireframe.generate
    enabled: true
    optional: true
    priority: 10
    prompt: Generate wireframes for this feature now?
    description: Offer wireframe generation after spec creation
    condition: null
  - extension: superb
    command: speckit.superb.brainstorm
    enabled: true
    optional: true
    priority: 10
    prompt: Refine the new spec.md with Superpowers brainstorming before clarification
      or planning?
    description: 'Optional spec refinement gate. Uses an installed superpowers brainstorming
      skill to strengthen the active Spec Kit spec.md while preserving Spec Kit ownership
      of specification creation.

      '
    condition: null
  before_plan:
  - extension: wireframe
    command: speckit.wireframe.review
    enabled: true
    optional: true
    priority: 10
    prompt: Review and sign off wireframes before planning? (signed-off wireframes
      become spec constraints)
    description: Ensure wireframes are reviewed and signed off before plan is written
    condition: null
  - extension: memorylint
    command: speckit.memorylint.load-agents
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.memorylint.load-agents?
    description: 'Mandatory gate: Load AGENTS.md to enforce core rules and prevent
      rule drift during the planning (plan.md generation) phase.'
    condition: null
  after_implement:
  - extension: wireframe
    command: speckit.wireframe.screenshots
    enabled: true
    optional: true
    priority: 10
    prompt: Capture implementation screenshots and compare to signed-off wireframes?
    description: 'Regression check: compare implementation to approved wireframes'
    condition: null
  before_implement:
  - extension: superb
    command: speckit.superb.implementation-gate
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.superb.implementation-gate?
    description: 'Mandatory readiness gate. Reports test-first constraints without
      executing tasks or taking ownership from speckit.implement.

      '
    condition: null
  before_constitution:
  - extension: memorylint
    command: speckit.memorylint.audit
    enabled: true
    optional: true
    priority: 10
    prompt: Run MemoryLint audit to generate a boundary report before constitution
      generation?
    description: ''
    condition: null
  after_constitution:
  - extension: memorylint
    command: speckit.memorylint.audit
    enabled: true
    optional: true
    priority: 10
    prompt: Run MemoryLint audit to check for conflicts between constitution and AGENTS.md?
    description: ''
    condition: null
  after_plan:
  - extension: data-model-diagram
    command: speckit.data-model-diagram.generate
    enabled: true
    optional: true
    priority: 10
    prompt: Generate a Mermaid ER diagram after planning?
    description: Generate a Mermaid ER diagram from the active feature data model
    condition: null
